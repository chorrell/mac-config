[project]
name = "mac-config"
version = "0.1.0"
description = "Automated macOS laptop configuration using Ansible"
readme = "README.md"
# ansible-core 2.21 supports controller Python 3.12-3.14; pin to the newest.
requires-python = ">=3.14,<3.15"
dependencies = [
    "ansible-core>=2.21",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.9",
    "molecule>=26.0",
    "pre-commit>=4.0",
    "yamllint>=1.38",
]

[tool.uv]
package = false
# Always use a uv-managed interpreter, never the system or Homebrew Python.
python-preference = "only-managed"
