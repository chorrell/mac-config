---
name: pre-commit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: chorrell/workflows/.github/workflows/pre-commit.yml@v1
    with:
      # These run through uv with Galaxy collections; lint.yml covers them
      skip: yamllint,ansible-lint
