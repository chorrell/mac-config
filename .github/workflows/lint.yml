---
name: Lint

on:
  pull_request:
    paths:
      - 'roles/**'
      - 'molecule/**'
      - '*.yml'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - 'collections/requirements.yml'
      - '.yamllint'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r collections/requirements.yml

      - name: Run ansible-lint
        run: uv run ansible-lint

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run yamllint
        run: uv run yamllint .
