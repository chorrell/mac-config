---
name: Lint

on:
  pull_request:
    paths:
      - 'roles/**'
      - 'molecule/**'
      - '*.yml'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - '.yamllint'
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint-action@v6
        with:
          args: ""

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
