---
name: Lint

on:
  pull_request:
    paths:
      - 'roles/**'
      - 'molecule/**'
      - '*.yml'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - 'collections/requirements.yml'
      - '.yamllint'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  # Pull requests are tested by the pull_request trigger; only main needs a
  # push trigger, to check the merged result
  push:
    branches:
      - main
    paths:
      - 'roles/**'
      - 'molecule/**'
      - '*.yml'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - 'collections/requirements.yml'
      - '.yamllint'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a PR, but let every push to main finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r collections/requirements.yml

      - name: Run ansible-lint
        run: uv run ansible-lint

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run yamllint
        run: uv run yamllint .
