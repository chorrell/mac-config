---
name: linting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    uses: chorrell/workflows/.github/workflows/shell-lint.yml@v1

  markdownlint:
    uses: chorrell/workflows/.github/workflows/markdownlint.yml@v1
