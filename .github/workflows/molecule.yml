---
name: Molecule Testing

on:
  # Every pull request, since Test Complete Playbook is required (a required check
  # that is skipped by a path filter would block the merge)
  pull_request:
  # Pull requests are tested by the pull_request trigger; only main needs a
  # push trigger, to check the merged result
  push:
    branches:
      - main
    paths:
      - 'roles/**'
      - 'molecule/**'
      - 'local.yml'
      - 'hosts'
      - 'ansible.cfg'
      - 'group_vars/**'
      - 'collections/requirements.yml'
      - '.github/workflows/molecule.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a PR, but let every push to main finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-playbook:
    name: Test Complete Playbook
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r collections/requirements.yml

      - name: Run Molecule tests (playbook)
        run: uv run molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
