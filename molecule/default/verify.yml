---
- name: Verify playbook execution
  hosts: local
  connection: local
  gather_facts: true
  tasks:
    - name: Verify base role directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: base_dirs
      failed_when: not base_dirs.stat.exists or not base_dirs.stat.isdir
      loop:
        - "{{ ansible_facts['user_dir'] }}/.config"
        - "{{ ansible_facts['user_dir'] }}/.local/bin"

    - name: List installed Homebrew formulae
      ansible.builtin.command: brew list --formula --full-name
      register: brew_formulae
      changed_when: false

    - name: List installed Homebrew casks
      ansible.builtin.command: brew list --cask --full-name
      register: brew_casks
      changed_when: false

    - name: Verify Homebrew formulae are installed
      ansible.builtin.assert:
        that: item.split('/') | last in brew_formulae.stdout_lines | map('split', '/') | map('last')
        fail_msg: "Formula {{ item }} is not installed"
        quiet: true
      loop: "{{ homebrew_formulae }}"

    - name: Verify Homebrew casks are installed
      ansible.builtin.assert:
        that: item.split('/') | last in brew_casks.stdout_lines | map('split', '/') | map('last')
        fail_msg: "Cask {{ item }} is not installed"
        quiet: true
      loop: "{{ homebrew_casks }}"

    - name: Verify Ghostty is installed
      ansible.builtin.stat:
        path: /Applications/Ghostty.app
      register: ghostty_app
      failed_when: not ghostty_app.stat.exists

    - name: Verify MesloLGS NF fonts are installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/Library/Fonts/MesloLGS NF {{ item }}.ttf"
      register: ghostty_font
      failed_when: not ghostty_font.stat.exists
      loop: [Regular, Bold, Italic, Bold Italic]

    - name: Validate the Ghostty config, including the custom theme
      ansible.builtin.command: >-
        /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config
        --config-file={{ ansible_facts['user_dir'] }}/.config/ghostty/config
      changed_when: false

    # fastfetch exits non-zero when it cannot parse the config file
    - name: Verify fastfetch runs with the installed config
      ansible.builtin.command: >-
        /opt/homebrew/bin/fastfetch --pipe
        --config {{ ansible_facts['user_dir'] }}/.config/fastfetch/config.jsonc
      changed_when: false
