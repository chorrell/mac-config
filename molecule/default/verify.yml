---
- name: Verify playbook execution
  hosts: local
  connection: local
  gather_facts: true
  tasks:
    - name: Verify base role directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: base_dirs
      failed_when: not base_dirs.stat.exists or not base_dirs.stat.isdir
      loop:
        - "{{ ansible_user_dir }}/.config"
        - "{{ ansible_user_dir }}/.local/bin"
