---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/collections/requirements.yml

driver:
  name: default

platforms:
  - name: localhost

provisioner:
  name: ansible
  config_options:
    defaults:
      inject_facts_as_vars: false
  inventory:
    hosts:
      local:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            # Install a small subset in CI instead of the full toolset. This
            # still exercises taps (with trust), formulae and casks.
            homebrew_taps:
              - terraform-linters/tap
            homebrew_formulae:
              - shfmt
              - zizmor
            homebrew_casks:
              - terraform-linters/tap/tflint
            vscode_extensions:
              - editorconfig.editorconfig

verifier:
  name: ansible

# Tests run directly against localhost, so there is nothing to create,
# prepare or destroy. Collections are installed before running Molecule
# (see README and CI), so the dependency step is skipped as well.
scenario:
  test_sequence:
    - syntax
    - converge
    - idempotence
    - verify

lint: |
  set -e
  yamllint .
  ansible-lint
