---
repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.20.0
    hooks:
      - id: markdownlint-docker
        name: markdownlint
        description: Run markdownlint on markdown files
        entry: markdownlint-cli2
        language: docker
        types: [markdown]
        args: []
