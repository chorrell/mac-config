---
- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: homebrew_check

- name: Install Homebrew if not present
  block:
    - name: Download and install Homebrew
      ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      environment:
        CI: "true"
      changed_when: true
  when:
    - install_homebrew
    - not homebrew_check.stat.exists
  tags: ['brew']

- name: Copy Brewfile to home directory
  ansible.builtin.copy:
    src: Brewfile
    dest: "{{ ansible_user_dir }}/.Brewfile"
    mode: '0644'
  notify: run brew bundle
  tags: ['brew']

- name: Install additional packages via homebrew module
  community.general.homebrew:
    name: "{{ homebrew_packages }}"
    state: present
  tags: ['brew']

- name: Update Homebrew cache
  ansible.builtin.shell: brew update
  changed_when: false
  tags: ['brew']

- name: Flush handlers to ensure brew bundle runs
  ansible.builtin.meta: flush_handlers

- name: Check Homebrew outdated packages
  ansible.builtin.shell: brew outdated --quiet
  register: brew_outdated
  changed_when: false
  failed_when: false
  tags: ['brew']

- name: Display outdated packages
  ansible.builtin.debug:
    msg: "Outdated packages available: {{ brew_outdated.stdout_lines | join(', ') }}"
  when: brew_outdated.stdout_lines | length > 0
  tags: ['brew']

- name: Add handlers for brew
  block:
    - name: Ensure handlers exist
      ansible.builtin.debug:
        msg: "Handlers will be added in handlers/main.yml"
