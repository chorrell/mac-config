---
- name: Create required config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ config_dirs }}"
  tags: ['always']

- name: Configure macOS system defaults
  block:
    - name: Check current key repeat rate
      ansible.builtin.shell: defaults read NSGlobalDomain KeyRepeat
      register: key_repeat_current
      changed_when: false
      failed_when: false
      when: configure_system_settings

    - name: Set key repeat rate
      ansible.builtin.shell: defaults write NSGlobalDomain KeyRepeat -int 2
      when:
        - configure_system_settings
        - key_repeat_current.stdout != "2"
      changed_when: true

  rescue:
    - name: System defaults configuration warning
      ansible.builtin.debug:
        msg: "Some system defaults could not be set. This is normal on restricted systems."
