---
- name: Copy zshrc configuration
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ ansible_user_dir }}/.zshrc"
    mode: '0644'
    backup: true
  when: configure_zsh
  tags: ['dotfiles', 'zsh']

- name: Copy zsh aliases
  ansible.builtin.copy:
    src: aliases.zsh
    dest: "{{ ansible_user_dir }}/.aliases.zsh"
    mode: '0644'
  when: configure_zsh
  tags: ['dotfiles', 'zsh']

- name: Check if zimfw is installed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.zim"
  register: zimfw_installed
  tags: ['dotfiles', 'zsh']

- name: Install zimfw
  ansible.builtin.shell: |
    curl -fsSL https://github.com/zimfw/zimfw/releases/latest/download/zimfw.zsh | zsh
  when:
    - install_zimfw
    - not zimfw_installed.stat.exists
  changed_when: true
  tags: ['dotfiles', 'zsh']

- name: Copy zimrc configuration
  ansible.builtin.copy:
    src: zimrc
    dest: "{{ ansible_user_dir }}/.zimrc"
    mode: '0644'
    backup: true
  when: configure_zsh
  notify: initialize zimfw
  tags: ['dotfiles', 'zsh']

- name: Copy git configuration
  ansible.builtin.copy:
    src: gitconfig
    dest: "{{ ansible_user_dir }}/.gitconfig"
    mode: '0644'
    backup: true
  when: configure_git
  tags: ['dotfiles', 'git']

- name: Configure git user name
  community.general.git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  when: configure_git
  tags: ['dotfiles', 'git']

- name: Configure git user email
  community.general.git_config:
    name: user.email
    value: "{{ git_user_email }}"
    scope: global
  when: configure_git
  tags: ['dotfiles', 'git']

- name: Configure git default branch
  community.general.git_config:
    name: init.defaultBranch
    value: "{{ git_default_branch }}"
    scope: global
  when: configure_git
  tags: ['dotfiles', 'git']

- name: Ensure proper shell is set
  ansible.builtin.shell: chsh -s /usr/local/bin/zsh
  changed_when: false
  failed_when: false
  tags: ['dotfiles', 'zsh']
