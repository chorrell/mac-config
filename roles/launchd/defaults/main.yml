---
# launchd role defaults
setup_auto_update: true
ansible_pull_repo: "https://github.com/YOUR_USERNAME/mac-config.git"
ansible_pull_dir: "~/.ansible/mac-config"
launchd_label: "com.user.ansible-pull"
launchd_plist_path: "{{ ansible_user_dir }}/Library/LaunchAgents/{{ launchd_label }}.plist"
log_path: "{{ ansible_user_dir }}/Library/Logs"

# Run on login (keep at true for your preference)
run_at_load: true

# Run every 24 hours (in seconds)
start_interval: 86400
