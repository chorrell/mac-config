---
- name: Configure macOS
  hosts: local
  connection: local
  become: false
  gather_facts: true

  pre_tasks:
    - name: Ensure Python interpreter is available
      ansible.builtin.debug:
        msg: "Running with Python {{ ansible_facts['python_version'] }}"

  roles:
    - role: base
      tags: ['system']
    - role: homebrew
      tags: ['packages', 'brew']
    - role: ghostty
      tags: ['ghostty', 'terminal']
    - role: fastfetch
      tags: ['fastfetch']

  post_tasks:
    - name: Configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration complete!"
