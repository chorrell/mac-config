---
- name: Configure macOS
  hosts: local
  connection: local
  become: false
  gather_facts: true

  pre_tasks:
    - name: Ensure Python interpreter is available
      ansible.builtin.debug:
        msg: "Running with Python {{ ansible_facts['python_version'] }}"

  roles:
    - role: base
      tags: ['system']
    - role: homebrew
      tags: ['packages', 'brew']
    - role: ghostty
      tags: ['ghostty', 'terminal']
    - role: vscode
      tags: ['vscode']
    - role: docker
      tags: ['docker']
    - role: fastfetch
      tags: ['fastfetch']
    - role: atuin
      tags: ['atuin', 'shell']
    - role: zsh
      tags: ['zsh', 'shell']
    - role: git
      tags: ['git']

  post_tasks:
    - name: Configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration complete!"
